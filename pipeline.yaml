name: research-paper
version: "3"

# mdharness is the orchestrator. Academic Research Skills do the work.
# Clone ARS with scripts/link_ars.py before the first run.
#
# This repo adds `brief` in front of ARS. ARS map after that:
#   1 research → 2 write → 2.5 integrity → 3 review → 4 revise
#   → 3' re-review → 4.5 final integrity → 5 finalize → 6 summary
#
# Re-revise (ARS 4') is another visit to `revise` when re-review fails.
stages:
  - id: brief
    agent: briefer
    description: >
      Interview the human to fill brief.md (skill: skills/define-brief/SKILL.md).
      Do not spawn a subagent. Follow agents/briefer.md in this conversation.
      Write artifacts/00-brief/HANDOFF.md only after the human approves the brief.
    produces:
      - artifacts/00-brief/HANDOFF.md

  - id: research
    agent: researcher
    description: >
      Dispatch deep-research (mode from brief.md, default full).
      Follow vendor/academic-research-skills/deep-research/SKILL.md.
      Write artifacts/01-research/HANDOFF.md when that skill is done.
    produces:
      - artifacts/01-research/HANDOFF.md

  - id: write
    agent: writer
    description: >
      Dispatch academic-paper in full mode on the Stage 1 handoff.
      Follow vendor/academic-research-skills/academic-paper/SKILL.md.
      Write artifacts/02-write/HANDOFF.md.
    produces:
      - artifacts/02-write/HANDOFF.md

  - id: integrity
    agent: auditor
    description: >
      Dispatch integrity_verification_agent in pre-review mode.
      Do not rewrite the paper except as that agent already allows.
      Write artifacts/03-integrity/HANDOFF.md with score: N, then gate.
    produces:
      - artifacts/03-integrity/HANDOFF.md
    gate:
      field: score
      op: gte
      threshold: 8
      on_fail: write
      on_pass: review
      max_attempts: 3

  - id: review
    agent: reviewer
    description: >
      Dispatch academic-paper-reviewer in full mode. Read-only on the paper.
      Follow vendor/academic-research-skills/academic-paper-reviewer/SKILL.md.
      Write artifacts/04-review/HANDOFF.md.
    produces:
      - artifacts/04-review/HANDOFF.md

  - id: revise
    agent: writer
    description: >
      Dispatch academic-paper in revision mode with the review packet.
      Write artifacts/05-revise/HANDOFF.md (revised paper + response to reviewers).
    produces:
      - artifacts/05-revise/HANDOFF.md

  - id: rereview
    agent: reviewer
    description: >
      Dispatch academic-paper-reviewer in re-review mode.
      Write artifacts/06-rereview/HANDOFF.md with score: N, then gate.
    produces:
      - artifacts/06-rereview/HANDOFF.md
    gate:
      field: score
      op: gte
      threshold: 7
      on_fail: revise
      on_pass: final-integrity
      max_attempts: 3

  - id: final-integrity
    agent: auditor
    description: >
      Dispatch integrity_verification_agent in final-check mode, from scratch.
      Write artifacts/07-final-integrity/HANDOFF.md with score: N, then gate.
    produces:
      - artifacts/07-final-integrity/HANDOFF.md
    gate:
      field: score
      op: gte
      threshold: 8
      on_fail: revise
      on_pass: finalize
      max_attempts: 3

  - id: finalize
    agent: writer
    description: >
      Dispatch academic-paper in format-convert mode.
      Write artifacts/08-finalize/HANDOFF.md.
    produces:
      - artifacts/08-finalize/HANDOFF.md

  - id: summary
    agent: summarizer
    description: >
      Write artifacts/09-summary/HANDOFF.md from state.json and prior handoffs.
      Do not re-run academic-pipeline; mdharness already tracked the run.
    produces:
      - artifacts/09-summary/HANDOFF.md

  - id: done
    description: Pipeline complete.
    terminal: true
